id: general-decision-lora-negative-gb10
version: "1.0"
date: "2026-10-15"
title: "A general Hungarian decision LoRA on held-out task groups (product matching, tool selection, KIE/validation): a pre-registered negative result on Qwen3.6-35B-A3B-FP8"
question: >-
  Does one decision LoRA trained on many Hungarian (and 25 % English) task families give more coverage at 95 %
  precision, and a better risk-coverage curve, than a careful calibration of the same model's untrained label
  probabilities on task groups it never saw - and does its validation calibration carry over to them?

task:
  type: classification            # selective multiple-choice decision with abstention (A-J or X = "none of these")
  document_types: [invoice-line, tool-call-request, synthetic-invoice]
  language: [hu, en]
  output_format: single label token (A-J or X) with label-restricted probability

dataset:
  name: "Training and validation: hu-general-decision-mix (Hugging Face). Held-out: round 1's hu-invoice-catalog-decisions test (HO-termek), round 2's confirmatory tool-selection test (HO-routing), synthetic KIE/validation invoices (HO-uj)"
  size:
    train_items: 17500
    train_items_hungarian: 13125
    train_items_english: 4375
    train_x_gold: 1619
    validation_items: 3122
    ho_termek_items: 5441
    ho_termek_scored: 4524
    ho_termek_x_gold: 1103
    ho_termek_clusters: 2759
    ho_routing_items: 7493
    ho_routing_scored: 7416
    ho_routing_x_gold: 2454
    ho_routing_clusters: 4169
    ho_uj_items: 2200
    ho_uj_scored: 2200
    ho_uj_x_gold: 306
    calibration_sample_ho_termek: 200
    calibration_sample_ho_routing: 146
    calibration_sample_ho_uj: 200
    test_id_items: 22741
  access: public                  # train + validation on Hugging Face; HO-termek public (round 1); HO-routing as in round 2's package; HO-uj regenerable from code
  ground_truth: >-
    Training: source gold (Hungarian human-labelled sets), construction gold (text structure, source metadata), and
    synthetic families generated by Apache-2.0 models with an independent different-family Apache-2.0 check (the
    subject's Qwen family neither generated nor checked); machine noise estimate per source, sources above 10 %
    excluded (HuSST 13.3 %, HuCommitmentBank 24.7 %); no closed-model output as label or target; no new human review.
    Held-out: HO-termek and HO-routing are the earlier rounds' human-reviewed frozen tests; HO-uj gold is computed in
    Python and recomputed independently from the rendered text by a unit test.
  notes: >-
    Each held-out group was excluded from training as a whole with every related source (source-name hold-out list,
    checked by name on 2026-10-13). No customer or tenant data in any split. Per-item read-outs are not published in
    this package; their sha256 are in the seal chain (results/PECSET.sha256, results/V1-MANIFEST-kiolvasasok.sha256).

systems:
  - label: L1★
    role: baseline
    model: Qwen/Qwen3.6-35B-A3B-FP8
    engine: "vLLM 0.30.0 (same image as round 2), LoRA-enabled server, no MTP, DGX Spark GB10"
    sampling: { mode: "one forward pass; label-token log-probabilities", thinking: false }
    notes: "Calibrated base read-out: four option orders averaged, temperature 1.431 fitted on validation, tau@95 = 0.716. The baseline of H1."
  - label: L0′
    role: control
    model: Qwen/Qwen3.6-35B-A3B-FP8
    notes: "The L1* read-out repeated on a fresh vLLM instance at the end of the queue, with L1*'s calibration; measures instance noise."
  - label: G3
    role: candidate
    model: Qwen/Qwen3.6-35B-A3B-FP8 + general decision LoRA
    notes: "LoRA r16, alpha 32, lr 1e-4, 1 epoch, grad-accum 16, on attention, GatedDeltaNet projections and the shared-expert MLP (no LoRA on routed experts); loss CE on gold (eps 0.05) + 0.5*Brier + 0.5*KL(p_L1* || p_adapter) on X-gold items (base anchor); 30 % option permutation; trained in BF16 on a de-quantised copy, served on FP8; 3 seeds, each with its own calibration arm and validation tau@95 (0.786, 0.759, 0.760). Published as a negative-result artifact: k3dani/Qwen3.6-35B-A3B-hu-general-decision-lora-negative-result."
  - label: G3-kemény
    role: control
    model: Qwen/Qwen3.6-35B-A3B-FP8 + LoRA
    notes: "G3 without the anchor (beta = 0), seed 1: the anchor ablation (H6)."
  - label: G3-hu
    role: control
    model: Qwen/Qwen3.6-35B-A3B-FP8 + LoRA
    notes: "G3 without the English backbone (13 125 items), seed 1 (H4)."
  - label: L3-spec
    role: reference
    model: Qwen/Qwen3.6-35B-A3B-FP8 + task-specific decision LoRA
    notes: "The previous round's task-specific adapters on their own test with their own round's calibration: round 1's invoice adapter on HO-termek, round 2's tool-selection adapter on HO-routing; 3 seeds each (H2)."
  - label: Mistral Small 4, Gemma 4 26B-A4B-it, Muse-Glimmer-30B, Llama-3.3-70B
    role: instrument
    notes: "Training-data side only: synthetic generation (Muse, Mistral), independent checking (Gemma), synonym filtering and machine noise estimate. None is a label source for the held-out tests. Four soft-target teacher candidates (Mistral Small 4, Gemma 4, Qwen3.6 thinking, Qwen3.8-27B) failed the pre-set gate, so no teacher was used."

metrics:
  - name: coverage_at_95_precision
    definition: >-
      Share of scored items whose top label is not X and whose confidence is >= tau; tau chosen on validation as the
      smallest threshold whose one-sided 95 % Clopper-Pearson lower bound of precision is >= 0.95. Test precision
      < 0.93 = precision failure. Hierarchical bootstrap (seed x cluster), 10 000 replicates, validation and
      calibration samples resampled by cluster and tau re-chosen per replicate; Holm over H1's six tests.
    primary: true
    preregistered: "full"
  - name: aurc
    definition: "Area under the risk-coverage curve of the arm's own non-X decisions; co-primary with Holm."
    primary: true
    preregistered: "full"
  - name: h1_layer_verdict
    definition: >-
      Per held-out layer: 'does not meet the requirements' if the seed-averaged G3 precision at the validation tau is
      < 0.93 or either endpoint is significantly against G3 after Holm; 'generalises' if not and at least one endpoint
      improves significantly with all three seeds on the favourable side; otherwise 'undecidable'.
    primary: true
    preregistered: "full"
  - name: h2_transfer_contrast
    definition: "D = [cov(G3) - cov(L1*)] - 0.5 * [cov(L3-spec) - cov(L1*)]; 'substantial transfer' if D's lower CI bound > 0; coverage only, no precision condition. Gain ratio descriptive."
    primary: false
    preregistered: "full"
  - name: h3_calibration_transfer
    definition: "Seed-averaged G3 precision >= 0.93 at (a) the validation tau, (b) a tau chosen on the layer's calibration sample with the same rule; no valid tau = not a success."
    primary: false
    preregistered: "full"
  - name: x_recall
    definition: "Share of 'none of these' items whose top label is X, threshold-free; H6(a) non-inferiority margin -2 points (exploratory)."
    primary: false
    preregistered: "full"
  - name: error_source_breakdown
    definition: "Accepted errors on X-gold vs wrong option, non-X precision, X-gold acceptance rate, errors at >= 0.95 confidence, X recall by source and family."
    primary: false
    preregistered: "post-hoc"
  - name: two_stage_decision
    definition: "X from the calibrated base (gate on L1* top-1 = X), option from G3, confidence (1 - p_L1*(X)) * p_G3(option | not X); 2 000-replicate bootstrap on already used test layers; exploratory."
    primary: false
    preregistered: "post-hoc"

decision_rule: >-
  Fixed in v1 (2026-10-14, before the held-out comparisons were viewed): H1's three-state layer verdict above; a
  single successful layer does not support a claim for all task families. The protocol made a public general
  decision adapter conditional on the result; the publication of the failed adapter as a labelled negative-result
  artifact and of the dataset was decided on 2026-10-15, after the result, and is not a pre-registered rule.

results:
  ho_termek:
    L1_star: { coverage_at_95: 0.653, precision: 0.963, aurc: 0.0296, ece: 0.058, x_recall: 0.415 }
    G3_mean_3_seeds: { coverage_at_95: 0.761, coverage_range: [0.744, 0.794], precision: 0.912, precision_range: [0.878, 0.933], aurc: 0.0434, ece: 0.062, x_recall: 0.340 }
    L3_spec_round1: { coverage_at_95: 0.756, precision: 0.973, aurc: 0.0016, x_recall: 0.942 }
    H1: "does not meet the requirements: coverage +11.1 points [6.9, 16.1] (bootstrap median), AURC +0.014 [0.002, 0.027] against G3, p = 0.016"
  ho_routing:
    L1_star: { coverage_at_95: 0.644, precision: 0.918, aurc: 0.0343, ece: 0.023, x_recall: 0.765 }
    G3_mean_3_seeds: { coverage_at_95: 0.732, coverage_range: [0.730, 0.733], precision: 0.866, precision_range: [0.861, 0.870], aurc: 0.0816, ece: 0.064, x_recall: 0.570 }
    L3_spec_round2: { coverage_at_95: 0.768, precision: 0.838, aurc: 0.0641, x_recall: 0.670 }
    H1: "does not meet the requirements: coverage +8.9 points [6.7, 11.3], AURC +0.047 [0.039, 0.057] against G3"
  ho_uj:
    L1_star: { coverage_at_95: 0.568, precision: 0.938, aurc: 0.0717, ece: 0.043, x_recall: 0.353 }
    G3_mean_3_seeds: { coverage_at_95: 0.636, coverage_range: [0.620, 0.661], precision: 0.905, precision_range: [0.892, 0.916], aurc: 0.0444, ece: 0.074, x_recall: 0.653 }
    H1: "does not meet the requirements: coverage +7.2 points [3.7, 11.0], AURC -0.027 [-0.033, -0.022] in G3's favour"
  H2:
    ho_termek: "substantial transfer (coverage only): L3-L1* +10.3 [6.3, 15.3], D +5.7 [2.5, 9.7] points, gain ratio 1.05 [0.73, 1.62]"
    ho_routing: "substantial transfer (coverage only): L3-L1* +12.4 [9.6, 15.1], D +2.6 [0.7, 4.9] points, gain ratio 0.71 [0.55, 0.94]"
  H3:
    a_validation_tau_precision: { ho_termek: [0.912, 0.875, 0.941], ho_routing: [0.866, 0.846, 0.882], ho_uj: [0.905, 0.880, 0.925] }
    b_calibration_sample: "HO-termek and HO-routing: no valid tau (also in 90 % / 97 % of replicates), not a success; HO-uj: met, precision 0.975 [0.938, 0.989], coverage 0.34-0.52 by seed (L1*: 0.976 / 0.50)"
  H4: "HO-termek and HO-uj: does not meet the requirements (G3 s1 precision 0.924 / 0.916); HO-routing Hungarian part: helps (AURC -0.0026 [-0.0048, -0.0010], precision 0.964)"
  H5: "coverage@95 rises on all 23 in-distribution families; precision falls on the legal families (MultiEURLEX 0.78 -> 0.68, NJT chapter 0.93 -> 0.77, NJT title 0.95 -> 0.87)"
  H6:
    a_x_recall_g3_minus_l1_points: { ho_routing: [-19.3, -24.3, -15.5], ho_termek: [-7.6, -13.8, -0.4] }
    a_x_recall_hard_minus_l1_points: { ho_routing: [-23.6, -25.3, -21.9], ho_termek: [-2.0, -4.5, 0.4] }
    verdict: "X recall preservation not shown for G3 or G3-kemeny; the anchor's effect differs in sign between layers (exploratory, one seed)"
  error_source_post_hoc:
    non_x_precision: { ho_termek: { L1_star: 0.997, G3: 0.991 }, ho_routing: { L1_star: 0.995, G3: 0.993 } }
    x_gold_accepted_above_tau: { ho_termek: { L1_star: 0.092, G3: 0.251 }, ho_routing: { L1_star: 0.150, G3: 0.283 } }
    ho_uj_x_recall_natural: { L1_star: 0.01, G3: 0.84 }
    ho_uj_x_recall_missing_precondition: { L1_star: 0.50, G3: 0.58 }
  two_stage_exploratory:
    coverage_at_95_own_test_tau: { ho_termek: { L1_star: 0.682, two_stage: 0.675, G3: 0.650 }, ho_routing: { L1_star: 0.471, two_stage: 0.490, G3: 0.016 }, ho_uj: { L1_star: 0.525, two_stage: 0.512, G3: 0.528 } }
  instance_noise_L0prime: "top-1 flips 1.2-3.5 %, |delta coverage@95| <= 0.2 points; the L0' rule never applied"

verdict: >-
  The general decision adapter does not meet the pre-registered requirements on any held-out group: it decides 7.2 to
  11.1 points more, but at 0.866-0.912 precision, because it confidently assigns "none of these" items to an option
  (25 % vs 9 % on product matching, 28 % vs 15 % on tool selection); on answerable items it is as precise as the base
  model. Its validation calibration does not transfer, and the base anchor did not protect "none of these". No general
  adapter in DocAI; the three seeds and the training/validation data are published as a labelled negative result.
  The research line is parked; "none of these" as a separate, target-domain decision is the open question.

reproducibility:
  level: R1
  code: published
  data: public
  results: aggregated
  runs_per_variant: 3
  not_published: >-
    The per-item read-outs (25 files, sealed by sha256 in results/), the item files of the held-out layers and the
    calibration samples (HO-termek is round 1's public test; HO-routing as in round 2's package; HO-uj regenerable with
    code/kor03/eszkozok/kie03.py, rebuild not run), the re-read (id, perm) pair list, run logs, and the source
    downloads. Re-running the read-outs needs a GPU, the public base model and the published adapters.
  verified_by: >-
    code/verify_package.py: checks the v1 freeze (manifest hash against the record and the analysis chain; frozen
    runbook, seal snapshot and analysis code against the manifest; one file published with a one-line redaction is
    reported as not comparable), the seal chain of the read-outs, the output hashes, and the pre-registered verdicts
    and about 160 numbers quoted in README.md against the machine outputs - 257 checks, all passed on 2026-10-15. The
    bootstrap itself is not re-run.

limitations:
  - "One model, one quantisation (FP8), one engine build (vLLM 0.30.0), one hardware (GB10)."
  - "Three held-out groups; HO-termek and HO-routing were designed in earlier rounds of the same study (HO-termek synthetic from one generator family)."
  - "The HO-uj verdict hinges on one arithmetic family (totals), where every arm is weak without thinking."
  - "No new human review in this round; training labels carry a machine noise estimate only."
  - "The planned soft-target teacher failed its gate, so the tested recipe is gold + anchor; the anchor result is one seed and exploratory."
  - "H4 confounds the English backbone with 25 % more training data; one seed."
  - "Rows of two G3 seeds were re-read from a different vLLM instance after a loader bug; the instance effect cannot be separated from source composition."
  - "Intervals are conditional on the read-out mode and temperature chosen on validation."
  - "H2's definition compares coverage without a precision condition."
  - "Error-source breakdowns and the two-stage decision are post hoc, on already used test layers."
  - "Per-item read-outs are not published here; numbers are checked against hashes and machine outputs, not recomputed."

